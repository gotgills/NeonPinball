name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix and Build with Gradle
        run: |
          # यदि gradlew फाइल छैन भने नयाँ सिर्जना गर्ने
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating a new one..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonPinball-debug-apk
          path: app/build/outputs/apk/debug/*.apk
