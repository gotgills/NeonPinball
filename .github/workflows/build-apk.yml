name: Build Android APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Repair Complete Android Project & Physics Engine
      run: |
        # 1. Root settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "NeonPinball"
        include ':app'
        EOF

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.7.0' apply false
        }
        EOF

        # 3. App module build.gradle
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.neonpinball'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.neonpinball"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 4. AndroidManifest.xml
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="NeonPinball"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.java
        mkdir -p app/src/main/java/com/example/neonpinball
        cat << 'EOF' > app/src/main/java/com/example/neonpinball/MainActivity.java
        package com.example.neonpinball;

        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(new PinballView(this, null));
            }
        }
        EOF

        # 6. PinballView.java Physics Engine
        cat << 'EOF' > app/src/main/java/com/example/neonpinball/PinballView.java
        package com.example.neonpinball;

        import android.content.Context;
        import android.graphics.Canvas;
        import android.graphics.Color;
        import android.graphics.Paint;
        import android.util.AttributeSet;
        import android.view.MotionEvent;
        import android.view.View;

        public class PinballView extends View {

            private static final float GRAVITY = 1500f;
            private static final int SUB_STEPS = 8;
            private static final float RESTITUTION = 0.7f;

            private float ballX = 300f;
            private float ballY = 400f;
            private float ballVX = 200f;
            private float ballVY = 0f;
            private final float ballRadius = 25f;

            private float leftFlipperAngle = 0.3f;
            private float rightFlipperAngle = -0.3f;
            private boolean isLeftFlipping = false;
            private boolean isRightFlipping = false;

            private long lastTime = System.currentTimeMillis();
            private final Paint paint = new Paint();

            public PinballView(Context context, AttributeSet attrs) {
                super(context, attrs);
                paint.setAntiAlias(true);
            }

            @Override
            protected void onDraw(Canvas canvas) {
                super.onDraw(canvas);

                long now = System.currentTimeMillis();
                float dt = Math.min((now - lastTime) / 1000f, 0.033f);
                lastTime = now;

                updatePhysics(dt);

                canvas.drawColor(Color.BLACK);

                paint.setColor(Color.CYAN);
                canvas.drawCircle(ballX, ballY, ballRadius, paint);

                paint.setColor(Color.MAGENTA);
                paint.setStrokeWidth(18f);

                float leftPivotX = getWidth() * 0.25f;
                float leftPivotY = getHeight() - 200f;
                float rightPivotX = getWidth() * 0.75f;
                float rightPivotY = getHeight() - 200f;
                float flipperLength = 180f;

                canvas.drawLine(
                    leftPivotX, leftPivotY,
                    leftPivotX + (float) Math.cos(leftFlipperAngle) * flipperLength,
                    leftPivotY + (float) Math.sin(leftFlipperAngle) * flipperLength,
                    paint
                );

                canvas.drawLine(
                    rightPivotX, rightPivotY,
                    rightPivotX - (float) Math.cos(rightFlipperAngle) * flipperLength,
                    rightPivotY + (float) Math.sin(rightFlipperAngle) * flipperLength,
                    paint
                );

                invalidate();
            }

            private void updatePhysics(float dt) {
                float subDt = dt / SUB_STEPS;
                int width = getWidth();
                int height = getHeight();

                if (width == 0 || height == 0) return;

                for (int step = 0; step < SUB_STEPS; step++) {
                    ballVY += GRAVITY * subDt;
                    ballX += ballVX * subDt;
                    ballY += ballVY * subDt;

                    if (ballX - ballRadius < 0) {
                        ballX = ballRadius;
                        ballVX = -ballVX * RESTITUTION;
                    } else if (ballX + ballRadius > width) {
                        ballX = width - ballRadius;
                        ballVX = -ballVX * RESTITUTION;
                    }

                    if (ballY - ballRadius < 0) {
                        ballY = ballRadius;
                        ballVY = -ballVY * RESTITUTION;
                    } else if (ballY + ballRadius > height) {
                        ballX = width / 2f;
                        ballY = 200f;
                        ballVX = 150f;
                        ballVY = 0f;
                    }

                    float leftPivotX = width * 0.25f;
                    float leftPivotY = height - 200f;
                    if (Math.hypot(ballX - leftPivotX, ballY - leftPivotY) < ballRadius + 100f && isLeftFlipping) {
                        ballVY = -850f;
                        ballVX += 200f;
                    }

                    float rightPivotX = width * 0.75f;
                    float rightPivotY = height - 200f;
                    if (Math.hypot(ballX - rightPivotX, ballY - rightPivotY) < ballRadius + 100f && isRightFlipping) {
                        ballVY = -850f;
                        ballVX -= 200f;
                    }
                }

                leftFlipperAngle += ((isLeftFlipping ? -0.5f : 0.3f) - leftFlipperAngle) * 0.35f;
                rightFlipperAngle += ((isRightFlipping ? -0.5f : 0.3f) - rightFlipperAngle) * 0.35f;
            }

            @Override
            public boolean onTouchEvent(MotionEvent event) {
                switch (event.getAction()) {
                    case MotionEvent.ACTION_DOWN:
                        if (event.getX() < getWidth() / 2f) isLeftFlipping = true;
                        else isRightFlipping = true;
                        break;
                    case MotionEvent.ACTION_UP:
                        isLeftFlipping = false;
                        isRightFlipping = false;
                        break;
                }
                return true;
            }
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.12'

    - name: Build Debug APK
      run: |
        gradle wrapper --gradle-version 8.12
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
