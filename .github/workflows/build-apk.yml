name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # यसले एन्ड्रोइड बिल्डका लागि आवश्यक सबै Gradle इन्स्टल र सेटअप गर्छ
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # नयाँ gradlew फाइल बनाएर सिधै एप बिल्ड गर्ने सुरक्षित कमान्ड
      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonPinball-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
