name: Build Android APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.12'

    - name: Repair Complete Android Project & Physics Engine
      run: |
        # 1. Root settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "NeonPinball"
        include ':app'
        EOF

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.7.3' apply false
        }
        EOF

        # 3. App module build.gradle
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.neonpinball'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.neonpinball"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 4. AndroidManifest.xml
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="Neon Pinball"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.java
        mkdir -p app/src/main/java/com/example/neonpinball
        cat << 'EOF' > app/src/main/java/com/example/neonpinball/MainActivity.java
        package com.example.neonpinball;

        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(new PinballView(this, null));
            }
        }
        EOF

        # 6. Optimized Physics & Neon Custom View Engine
        cat << 'EOF' > app/src/main/java/com/example/neonpinball/PinballView.java
        package com.example.neonpinball;

        import android.content.Context;
        import android.graphics.Canvas;
        import android.graphics.Color;
        import android.graphics.Paint;
        import android.util.AttributeSet;
        import android.view.MotionEvent;
        import android.view.View;
        import java.util.ArrayList;
        import java.util.List;

        public class PinballView extends View {

            private static final float GRAVITY = 1800f;
            private static final int SUB_STEPS = 10;
            private static final float RESTITUTION = 0.72f;

            private float ballX = 300f;
            private float ballY = 400f;
            private float ballVX = 250f;
            private float ballVY = 0f;
            private final float ballRadius = 24f;

            private float leftFlipperAngle = 0.4f;
            private float rightFlipperAngle = -0.4f;
            private boolean isLeftFlipping = false;
            private boolean isRightFlipping = false;

            private int score = 0;
            private long lastTime = System.currentTimeMillis();

            private final Paint ballPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
            private final Paint flipperPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
            private final Paint bumperPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
            private final Paint uiPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

            private final List<Bumper> bumpers = new ArrayList<>();

            static class Bumper {
                float x, y, radius;
                int color;
                Bumper(float x, float y, float radius, int color) {
                    this.x = x; this.y = y; this.radius = radius; this.color = color;
                }
            }

            public PinballView(Context context, AttributeSet attrs) {
                super(context, attrs);
                initPaints();
            }

            private void initPaints() {
                ballPaint.setColor(Color.CYAN);
                flipperPaint.setColor(Color.MAGENTA);
                flipperPaint.setStrokeWidth(22f);
                flipperPaint.setStrokeCap(Paint.Cap.ROUND);

                bumperPaint.setStyle(Paint.Style.FILL);

                uiPaint.setColor(Color.YELLOW);
                uiPaint.setTextSize(64f);
                uiPaint.setFakeBoldText(true);
            }

            private void setupBumpers(int w, int h) {
                if (bumpers.isEmpty() && w > 0) {
                    bumpers.add(new Bumper(w * 0.35f, h * 0.3f, 45f, Color.GREEN));
                    bumpers.add(new Bumper(w * 0.65f, h * 0.3f, 45f, Color.GREEN));
                    bumpers.add(new Bumper(w * 0.5f, h * 0.2f, 50f, Color.YELLOW));
                }
            }

            @Override
            protected void onDraw(Canvas canvas) {
                super.onDraw(canvas);
                int w = getWidth();
                int h = getHeight();
                if (w == 0 || h == 0) return;

                setupBumpers(w, h);

                long now = System.currentTimeMillis();
                float dt = Math.min((now - lastTime) / 1000f, 0.033f);
                lastTime = now;

                updatePhysics(dt, w, h);

                canvas.drawColor(Color.parseColor("#0A0A12"));

                for (Bumper b : bumpers) {
                    bumperPaint.setColor(b.color);
                    canvas.drawCircle(b.x, b.y, b.radius, bumperPaint);
                }

                float leftPivotX = w * 0.28f;
                float leftPivotY = h - 220f;
                float rightPivotX = w * 0.72f;
                float rightPivotY = h - 220f;
                float flipperLength = 170f;

                float lTipX = leftPivotX + (float) Math.cos(leftFlipperAngle) * flipperLength;
                float lTipY = leftPivotY + (float) Math.sin(leftFlipperAngle) * flipperLength;
                float rTipX = rightPivotX - (float) Math.cos(rightFlipperAngle) * flipperLength;
                float rTipY = rightPivotY + (float) Math.sin(rightFlipperAngle) * flipperLength;

                canvas.drawLine(leftPivotX, leftPivotY, lTipX, lTipY, flipperPaint);
                canvas.drawLine(rightPivotX, rightPivotY, rTipX, rTipY, flipperPaint);

                canvas.drawCircle(ballX, ballY, ballRadius, ballPaint);
                canvas.drawText("SCORE: " + score, 40f, 90f, uiPaint);

                invalidate();
            }

            private void updatePhysics(float dt, int w, int h) {
                float subDt = dt / SUB_STEPS;

                for (int step = 0; step < SUB_STEPS; step++) {
                    ballVY += GRAVITY * subDt;
                    ballX += ballVX * subDt;
                    ballY += ballVY * subDt;

                    if (ballX - ballRadius < 0) { ballX = ballRadius; ballVX = -ballVX * RESTITUTION; }
                    else if (ballX + ballRadius > w) { ballX = w - ballRadius; ballVX = -ballVX * RESTITUTION; }

                    if (ballY - ballRadius < 0) { ballY = ballRadius; ballVY = -ballVY * RESTITUTION; }
                    else if (ballY + ballRadius > h) {
                        ballX = w * 0.5f; ballY = 200f; ballVX = 200f; ballVY = 0f; score = 0;
                    }

                    for (Bumper b : bumpers) {
                        float dx = ballX - b.x;
                        float dy = ballY - b.y;
                        float dist = (float) Math.hypot(dx, dy);
                        if (dist < ballRadius + b.radius) {
                            float nx = dx / dist;
                            float ny = dy / dist;
                            ballX = b.x + nx * (ballRadius + b.radius);
                            float speed = (float) Math.hypot(ballVX, ballVY);
                            float bounceSpeed = Math.max(speed * 1.2f, 900f);
                            ballVX = nx * bounceSpeed;
                            ballVY = ny * bounceSpeed;
                            score += 100;
                        }
                    }

                    float leftPivotX = w * 0.28f;
                    float leftPivotY = h - 220f;
                    float rightPivotX = w * 0.72f;
                    float rightPivotY = h - 220f;
                    float flipperLength = 170f;

                    collideSegment(leftPivotX, leftPivotY,
                        leftPivotX + (float) Math.cos(leftFlipperAngle) * flipperLength,
                        leftPivotY + (float) Math.sin(leftFlipperAngle) * flipperLength,
                        isLeftFlipping);

                    collideSegment(rightPivotX, rightPivotY,
                        rightPivotX - (float) Math.cos(rightFlipperAngle) * flipperLength,
                        rightPivotY + (float) Math.sin(rightFlipperAngle) * flipperLength,
                        isRightFlipping);
                }

                leftFlipperAngle += ((isLeftFlipping ? -0.5f : 0.4f) - leftFlipperAngle) * 0.35f;
                rightFlipperAngle += ((isRightFlipping ? -0.4f : 0.4f) - rightFlipperAngle) * 0.35f;
            }

            private void collideSegment(float x1, float y1, float x2, float y2, boolean isFlipping) {
                float dx = x2 - x1;
                float dy = y2 - y1;
                float len = (float) Math.hypot(dx, dy);
                if (len == 0) return;

                float u = Math.max(0, Math.min(1, ((ballX - x1) * dx + (ballY - y1) * dy) / (len * len)));
                float nearestX = x1 + u * dx;
                float nearestY = y1 + u * dy;

                float distX = ballX - nearestX;
                float distY = ballY - nearestY;
                float dist = (float) Math.hypot(distX, distY);

                if (dist < ballRadius + 12f) {
                    float nx = distX / dist;
                    float ny = distY / dist;
                    ballX = nearestX + nx * (ballRadius + 12f);

                    float dot = ballVX * nx + ballVY * ny;
                    if (dot < 0) {
                        ballVX = (ballVX - 2 * dot * nx) * RESTITUTION;
                        ballVY = (ballVY - 2 * dot * ny) * RESTITUTION;
                        if (isFlipping) {
                            ballVY -= 1000f;
                            ballVX += nx * 400f;
                        }
                    }
                }
            }

            @Override
            public boolean onTouchEvent(MotionEvent event) {
                switch (event.getAction()) {
                    case MotionEvent.ACTION_DOWN:
                        if (event.getX() < getWidth() / 2f) isLeftFlipping = true;
                        else isRightFlipping = true;
                        break;
                    case MotionEvent.ACTION_UP:
                        isLeftFlipping = false;
                        isRightFlipping = false;
                        break;
                }
                return true;
            }
        }
        EOF

    - name: Build Debug APK
      run: |
        gradle wrapper --gradle-version 8.12
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
