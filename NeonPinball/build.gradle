buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Upgrades AGP to support Gradle 9.0+ API requirements
        classpath 'com.android.tools.build:gradle:8.8.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
